# FIXTURE — see README. Names an organisation secret shared with SELECTED repositories that do
# NOT include this one. Expected: the reference is UNRESOLVED with no edge — at runtime GitHub
# hands the step an empty string, exactly as it would for a name that does not exist, which is
# the silent failure the secrets surface exists to catch.
name: fixture-secret-reach-out-of-scope
on:
  workflow_dispatch:
# The workflow needs no token at all: the job never runs, and the collector reads this
# file rather than executing it. Empty rather than omitted (CodeQL
# actions/missing-workflow-permissions) — an omitted block inherits the repository
# default, which is a broader grant than a fixture has any business holding.
permissions: {}
jobs:
  never:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Name a probe secret this repository is not on the list for
        env:
          PROBE: ${{ secrets.TAP_SCOPE_PROBE_ELSEWHERE }}
        run: echo "fixture; never executes"
