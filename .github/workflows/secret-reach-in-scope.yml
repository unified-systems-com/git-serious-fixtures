# FIXTURE — see README. Names an organisation secret shared with SELECTED repositories, from a
# repository that IS on that list. Expected: the reference RESOLVES and a REFERENCES_SECRET edge
# is emitted. Pairs with secret-reach-out-of-scope.yml, which is the same shape from the wrong
# side of the list.
name: fixture-secret-reach-in-scope
on:
  workflow_dispatch:
# The workflow needs no token at all: the job never runs, and the collector reads this
# file rather than executing it. Empty rather than omitted (CodeQL
# actions/missing-workflow-permissions) — an omitted block inherits the repository
# default, which is a broader grant than a fixture has any business holding.
permissions: {}
jobs:
  never:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Name the probe secret so the collector has a reference to resolve
        env:
          # Never printed, and never read: the job does not run. The collector reads the FILE.
          PROBE: ${{ secrets.TAP_SCOPE_PROBE }}
        run: echo "fixture; never executes"
